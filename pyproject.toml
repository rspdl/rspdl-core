[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "rspdl"
dynamic = ["version"]
description = "Python SDK for deterministic RSPDL planning analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.html"]
authors = [{ name = "RSPDL maintainers" }]
keywords = ["rspdl", "policy", "planning", "compiler", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/rspdl/rspdl-core"
Issues = "https://github.com/rspdl/rspdl-core/issues"

[tool.maturin]
bindings = "pyo3"
manifest-path = "bindings/python/Cargo.toml"
module-name = "rspdl._native"
python-source = "bindings/python/python"
strip = true
