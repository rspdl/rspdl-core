[workspace]
members = [
    "crates/rspdl-domain",
    "crates/rspdl-datalog",
    "crates/rspdl-solver-z3",
]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/rspdl/rspdl-domain"
rust-version = "1.85"

[workspace.dependencies]
num-bigint = "0.4.6"
num-prime = { version = "0.5.0", default-features = false }
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
z3 = { version = "0.20.1", features = ["vendored"] }

[profile.dev.package.z3-sys]
opt-level = 1
debug = false
