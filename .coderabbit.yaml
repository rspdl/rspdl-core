# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "README.md"
      - "AGENTS.md"
      - "docs/architecture.md"
      - "docs/prd.md"
      - "docs/product/*.md"
      - "docs/problems/*.md"
      - "docs/guides/*.md"
      - "docs/rfcs/*.md"

reviews:
  path_instructions:
    - path: "**"
      instructions: |
        Product, language-semantic, and architecture changes must be traceable
        to at least one causal Problem Topic through problem_refs. Verify that
        the change preserves an explicit chain from problem to requirement or
        decision, implementation, and test or diagnostic evidence. Do not
        accept claims that unmodeled intent is inferred or that unsupported
        semantics are treated as success.
    - path: "crates/rspdl-ko/**"
      instructions: |
        Treat docs/rfcs/0004-natural-korean-domain-grammar.md as the normative
        Korean frontend specification. Verify grammar recognition, generated
        Rule ID determinism, source spans, recovery, formatter idempotence, and
        format-before/after canonical IR equivalence against that document.
    - path: "crates/rspdl-domain/**"
      instructions: |
        Review against docs/architecture.md and
        docs/rfcs/0002-typed-domains-and-logic-core.md and
        docs/rfcs/0007-finite-relational-model-finding.md. Preserve the
        locale-independent semantic boundary, exact bounded-model outcomes,
        and canonical ordering contracts.
    - path: "crates/rspdl-compiler/**"
      instructions: |
        Review against docs/architecture.md,
        docs/rfcs/0004-natural-korean-domain-grammar.md, and
        docs/rfcs/0006-total-policy-condition-space-analysis.md, and
        docs/rfcs/0007-finite-relational-model-finding.md. Focus on name
        resolution, type checking, JSON binding, optional-field semantics,
        deterministic findings, and the direct-matching/Z3 execution contract.
    - path: "crates/rspdl-cli/**"
      instructions: |
        Verify the CLI and exit-code contract documented in
        docs/rfcs/0004-natural-korean-domain-grammar.md.
    - path: "docs/**"
      instructions: |
        Check that examples, EBNF, static semantics, runtime semantics, and
        implemented code remain consistent with each other. Problem Topics
        must describe one causal mechanism, remain solution-neutral, use the
        required Why/What/How/Constraints/References order, and stay under 150
        lines. Verify current implementation and future scope are not conflated.
